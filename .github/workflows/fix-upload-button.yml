name: Fix Add PDF button

on:
  push:
    paths:
      - '.github/workflows/fix-upload-button.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair upload button handler
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('gemini_main.py')
          s = p.read_text(encoding='utf-8')
          old = 'onclick="$(\\"file\\").click()"'
          new = 'onclick="document.getElementById(\'file\').click()"'
          if old not in s:
              raise SystemExit('Expected broken Add PDF handler was not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gemini_main.py
          git commit -m 'fix: make Add PDF button open file picker'
          git push
